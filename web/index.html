<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PB Gen" />
  <meta name="description" content="PB Gen — generate fair, balanced Americano-style pickleball doubles tournaments with rotating partners, live scores, and a leaderboard." />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>PB Gen — Americano Pickleball Tournament Generator</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app-root" aria-live="polite"></div>

  <!-- Bottom sheet host (score picker, confirmations) -->
  <div id="sheet-host" class="sheet-host" hidden></div>

  <!-- Toast host -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
